<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8os.nl – SuitIT</title>
<meta name="description" content="SuitIT gaat aan de slag met 8os en 8bot van Pax8. Meer volgt.">
<style>
:root{--magenta:#D42E7C;--ink:#000;--paper:#fff}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:Interstate,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--paper);display:flex;flex-direction:column;min-height:100%}
header{padding:32px 40px}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:900;font-size:26px;letter-spacing:.06em}
.logo .ic{width:30px;height:30px;transform:rotate(45deg);border:3px solid var(--ink);display:grid;place-items:center}
.logo .ic i{display:block;width:12px;height:3px;background:var(--ink);box-shadow:0 -5px 0 var(--ink),0 5px 0 var(--ink)}
.logo .o{color:transparent;-webkit-text-stroke:1.5px var(--ink)}
main{flex:1;display:flex;align-items:center;padding:0 40px 40px}
.wrap{max-width:720px}
h1{font-size:clamp(64px,14vw,160px);font-weight:900;line-height:.9;letter-spacing:-.03em;margin:0 0 24px;color:var(--magenta)}
h1 span{color:var(--ink)}
p{font-size:clamp(18px,2.4vw,24px);line-height:1.45;margin:0 0 16px;font-weight:300;max-width:34em}
p.sub{font-size:clamp(16px,2vw,19px);color:#444}
a.cta{display:inline-block;margin-top:28px;padding:14px 26px;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:700;font-size:17px}
a.cta:hover,a.cta:focus-visible{background:var(--magenta);outline:none}
footer{padding:24px 40px;font-size:14px;color:#666}footer a{color:inherit}
@media(max-width:600px){header,main,footer{padding-left:22px;padding-right:22px}}
</style>
</head>
<body>
<header><a class="logo" href="https://www.suitit.nl" aria-label="SuitIT"><span class="ic"><i></i></span><span><span class="o">SUIT</span>IT</span></a></header>
<main><div class="wrap">
<h1>8os<span>.nl</span></h1>
<p>SuitIT gaat aan de slag met 8os en 8bot van Pax8: het besturingssysteem voor je AI-workforce. Wij zetten het in voor onszelf en voor onze klanten.</p>
<p class="sub">Meer volgt binnenkort.</p>
<a class="cta" href="https://www.suitit.nl">Naar www.suitit.nl</a>
</div></main>
<footer>SuitIT B.V., Eindhoven &middot; <a href="https://www.suitit.nl">www.suitit.nl</a></footer>
</body>
</html>
